name: nugget-ingest

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes (UTC)
  workflow_dispatch: {} # allow manual runs from the Actions tab

concurrency:
  group: nugget-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run ingest
        env:
          INGEST_ADAPTER: geckoterminal
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BITQUERY_API_KEY: ${{ secrets.BITQUERY_API_KEY }}
          BITQUERY_ENDPOINT: ${{ secrets.BITQUERY_ENDPOINT }}
          BITQUERY_NETWORK: ${{ secrets.BITQUERY_NETWORK }}
          NUGGET_TRACKED_POOLS: "40"
          NUGGET_ENABLE_TVL: ${{ secrets.NUGGET_ENABLE_TVL }}
          NUGGET_GECKOTERMINAL_NETWORK: ${{ secrets.NUGGET_GECKOTERMINAL_NETWORK }}
        run: npm run ingest
